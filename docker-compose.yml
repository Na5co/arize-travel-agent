services:
  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    # Published on localhost only: the API and Phoenix have no authentication.
    ports:
      - "127.0.0.1:6006:6006"   # UI and HTTP collector
      - "127.0.0.1:4317:4317"   # OTLP gRPC collector (also used by run_conversations.py on the host)
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data

  agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Inside the compose network Phoenix is reachable by its service name.
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    depends_on:
      - phoenix

volumes:
  phoenix_data:
